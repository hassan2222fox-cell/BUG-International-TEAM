<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BUG | University Learning Platform</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="cy" aria-hidden="true"></canvas>
    <div id="beam" aria-hidden="true"></div>

    <section id="login">
      <span class="bug" id="bug" aria-hidden="true"
        ><svg
          viewBox="0 0 32 32"
          width="34"
          height="34"
          fill="none"
          stroke="#00ffa8"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <g class="A">
            <path d="M14.5 10.5L9 5L5 3" />
            <path d="M14 16L6.5 16.5L3 21" />
            <path d="M17.5 19L24 23L26 29" />
            <path d="M18 13L25 10L29 11" />
          </g>
          <g class="B">
            <path d="M17.5 10.5L23 5L27 3" />
            <path d="M18 16L25.5 16.5L29 21" />
            <path d="M14.5 19L8 23L6 29" />
            <path d="M14 13L7 10L3 11" />
          </g>
          <ellipse cx="16" cy="19.5" rx="5" ry="6.5" fill="#06140f" />
          <ellipse cx="16" cy="11" rx="3.2" ry="3" fill="#06140f" />
          <circle cx="14.8" cy="10" r=".8" fill="#00ffa8" stroke="none" />
          <circle cx="17.2" cy="10" r=".8" fill="#00ffa8" stroke="none" />
          <path d="M16 15v8" stroke-width="1" opacity=".5" /></svg
      ></span>
      <div class="code" style="top: 8%; left: 5%">$ nmap -sV 10.0.0.0/24
PORT   STATE SERVICE
22/tcp open  ssh</div>
      <div class="code" style="bottom: 10%; right: 5%">if (token.valid()) {
  grant(session);
}</div>
      <form id="lc" class="glass" onsubmit="return false;" autocomplete="off" novalidate>
        <div style="text-align: center">
          <span class="logo" data-t="BUG">BUG</span>
          <span class="logo team" data-t="TEAM">TEAM</span>
          <p class="sub" style="margin: 4px 0 8px">University Learning Platform</p>
        </div>
        <label for="u">Username</label><input id="u" maxlength="40" autocomplete="username" />
        <label for="p">Password</label
        ><input id="p" type="password" maxlength="80" autocomplete="current-password" />
        <div id="err" role="alert"></div>
        <button class="btn" style="width: 100%; margin-top: 6px" id="lb">Log in</button>
      </form>
    </section>

    <div id="wel">
      <div>
        <h1>Welcome to BUG</h1>
        <p class="mono" style="color: var(--m)">
          authenticating session<span class="load" style="margin-left: 10px"></span>
        </p>
      </div>
    </div>

    <div id="app">
      <header>
        <button class="ghost" id="burger" aria-label="Toggle menu">☰</button>
        <span class="brand"
          ><span class="logo" data-t="BUG">BUG</span
          ><span class="logo team" data-t="TEAM">TEAM</span></span
        >
        <input
          class="s"
          id="q"
          placeholder="Search subjects, PDFs, videos, lectures…"
          aria-label="Search"
        />
        <div class="who">
          <span id="uname"></span>
          <div class="av" id="av" title="Profile"></div>
        </div>
        <button class="ghost" id="lo">Logout</button>
      </header>
      <aside id="side"></aside>
      <main id="main"></main>
    </div>
    <div id="modal"><div id="mb" class="glass"></div></div>

    <script src="js/data/subjects.js"></script>
    <script src="js/data/progcyber.js"></script>
    <script src="js/data/english.js"></script>
    <script src="js/data/iad.js"></script>
    <script src="js/data/securednet.js"></script>
    <script src="js/data/ai.js"></script>
    <script src="js/data/netsecproto.js"></script>
    <script src="js/data/techhistory.js"></script>
    <script src="js/data/ohs.js"></script>
    <script src="js/data/sections.js"></script>
    <script src="js/cyber.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
